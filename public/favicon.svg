<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E235C" />
      <stop offset="100%" stop-color="#061234" />
    </radialGradient>
    <pattern id="halftone-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2" fill="#38BDF8" opacity="0.15" />
    </pattern>
  </defs>
  
  <!-- Outer Badge -->
  <rect width="512" height="512" rx="140" fill="url(#bg-grad)" />
  <rect width="512" height="512" rx="140" fill="url(#halftone-dots)" />
  <rect width="504" height="504" x="4" y="4" rx="136" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />
  
  <!-- Text ARF (matching the official rounded bold font) -->
  <text x="256" y="280" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">
    ARF
  </text>
  
  <!-- Subtext creative -->
  <text x="256" y="360" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="52" font-weight="600" letter-spacing="4" fill="#CBD5E1" text-anchor="middle" dominant-baseline="middle">
    creative
  </text>
</svg>
